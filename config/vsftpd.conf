# Video Home Server — anonymous read-only FTP for VLC iOS.
listen=YES
listen_ipv6=NO

anonymous_enable=YES
anon_root=/home/pi/videos
no_anon_password=YES
anon_world_readable_only=YES

local_enable=NO
write_enable=NO
anon_upload_enable=NO
anon_mkdir_write_enable=NO
anon_other_write_enable=NO

dirmessage_enable=YES
use_localtime=YES
xferlog_enable=YES
xferlog_std_format=YES

# Passive mode — keep the port range tight so a future firewall rule is easy.
pasv_enable=YES
pasv_min_port=40000
pasv_max_port=40100

seccomp_sandbox=NO
