<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Video Home Server</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --card: #ffffff;
    --fg: #1c1c1e;
    --muted: #6e6e73;
    --accent: #0a84ff;
    --danger: #ff3b30;
    --border: #d1d1d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --fg: #f5f5f7;
      --muted: #8e8e93;
      --border: #3a3a3c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
  }
  h1 { font-size: 22px; margin: 16px 0 12px; }
  h2 { font-size: 15px; text-transform: uppercase; color: var(--muted); margin: 24px 4px 8px; letter-spacing: 0.5px; }
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
    border: 1px solid var(--border);
  }
  .url-row { display: flex; gap: 8px; }
  .cookie-toggle { font-size: 13px; color: var(--muted); margin-top: 6px; cursor: pointer; display: inline-block; }
  .cookie-toggle:hover { color: var(--accent); }
  #cookie-row { display: none; margin-top: 8px; }
  textarea#cookie-input {
    width: 100%;
    font-size: 13px;
    font-family: ui-monospace, monospace;
    padding: 8px 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--fg);
    resize: vertical;
    min-height: 60px;
  }
  input[type=url] {
    flex: 1;
    font-size: 16px;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--fg);
    min-width: 0;
  }
  button {
    font-size: 16px;
    padding: 12px 16px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: white;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button.secondary { background: transparent; color: var(--accent); padding: 8px 10px; }
  button.danger { background: transparent; color: var(--danger); padding: 8px 10px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .grow { flex: 1; min-width: 0; }
  .name { font-weight: 500; word-break: break-word; }
  .meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .progress-wrap { margin-top: 8px; }
  .progress-row { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
  .progress-label { font-size: 11px; color: var(--muted); width: 36px; flex-shrink: 0; }
  .progress {
    flex: 1;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress > div {
    height: 100%;
    background: var(--accent);
    transition: width 0.3s ease;
  }
  .empty { color: var(--muted); padding: 8px 4px; font-size: 14px; }
  .err { color: var(--danger); font-size: 13px; margin-top: 4px; word-break: break-word; }
  .badge {
    font-size: 11px; text-transform: uppercase; padding: 2px 6px;
    border-radius: 4px; background: var(--border); color: var(--muted);
    white-space: nowrap;
  }
  .badge.done { background: #34c75933; color: #34c759; }
  .badge.error { background: #ff3b3033; color: #ff3b30; }
  .badge.downloading { background: #0a84ff33; color: var(--accent); }
  a { color: var(--accent); text-decoration: none; }

  /* Format picker */
  #format-step { display: none; }
  #format-step .video-title {
    font-weight: 600;
    font-size: 15px;
    margin-bottom: 14px;
    word-break: break-word;
  }
  .fmt-group { margin-bottom: 12px; }
  .fmt-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--muted);
    margin-bottom: 5px;
  }
  select {
    width: 100%;
    font-size: 15px;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    appearance: auto;
  }
  .fmt-actions { display: flex; gap: 8px; margin-top: 4px; }
  .fmt-actions button { flex: 1; }
  .fmt-actions button.secondary { flex: 0; }
</style>
</head>
<body>
  <h1>Video Home Server</h1>

  <div class="card">
    <!-- Step 1: URL entry -->
    <div id="url-step">
      <div class="url-row">
        <input id="url-input" type="url" inputmode="url" autocomplete="off" autocapitalize="off"
               placeholder="Paste YouTube URL">
        <button id="btn-inspect">Get</button>
      </div>
      <span class="cookie-toggle" id="cookie-toggle">+ Add cookies</span>
      <div id="cookie-row">
        <textarea id="cookie-input" autocomplete="off" autocorrect="off" spellcheck="false"
                  placeholder="Paste Cookie header value, e.g. VISITOR_INFO1_LIVE=abc; YSC=xyz"></textarea>
      </div>
      <div id="form-msg" class="meta" style="margin-top:8px;"></div>
    </div>

    <!-- Step 2: Format picker -->
    <div id="format-step">
      <div class="video-title" id="video-title"></div>
      <div class="fmt-group">
        <div class="fmt-label">Video</div>
        <select id="sel-video"></select>
      </div>
      <div class="fmt-group">
        <div class="fmt-label">Audio</div>
        <select id="sel-audio"></select>
      </div>
      <div class="fmt-actions">
        <button id="btn-download">Download</button>
        <button id="btn-cancel" class="secondary">Cancel</button>
      </div>
      <div id="fmt-msg" class="meta" style="margin-top:8px;"></div>
    </div>
  </div>

  <h2>Downloading</h2>
  <div id="downloads"></div>

  <h2>Library</h2>
  <div id="library"></div>

  <h2>System</h2>
  <div class="card">
    <div class="row" style="flex-wrap:wrap;gap:8px;">
      <button id="btn-update" class="secondary" style="padding:10px 14px;">Update yt-dlp</button>
      <button id="btn-restart" class="danger" style="padding:10px 14px;">Restart service</button>
    </div>
    <div id="admin-msg" class="meta" style="margin-top:8px;"></div>
    <pre id="admin-output" style="display:none;margin:8px 0 0;font-size:12px;white-space:pre-wrap;word-break:break-all;background:var(--bg);padding:8px;border-radius:6px;overflow:auto;max-height:200px;"></pre>
  </div>

<script>
// ── Helpers ────────────────────────────────────────────────────────────────

function fmtSize(n) {
  if (n == null) return '';
  const u = ['B','KB','MB','GB','TB'];
  let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return `${n.toFixed(n >= 10 || i === 0 ? 0 : 1)} ${u[i]}`;
}

function fmtEta(s) {
  if (s == null) return '';
  if (s < 60) return `${s}s`;
  if (s < 3600) return `${Math.floor(s/60)}m ${s%60}s`;
  return `${Math.floor(s/3600)}h ${Math.floor((s%3600)/60)}m`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

// ── Format picker state ────────────────────────────────────────────────────

let pendingUrl = '';
let pendingCookies = '';

const urlStep     = document.getElementById('url-step');
const fmtStep     = document.getElementById('format-step');
const urlInput    = document.getElementById('url-input');
const cookieToggle= document.getElementById('cookie-toggle');
const cookieRow   = document.getElementById('cookie-row');
const cookieInput = document.getElementById('cookie-input');
const formMsg     = document.getElementById('form-msg');
const fmtMsg      = document.getElementById('fmt-msg');
const videoTitle  = document.getElementById('video-title');
const selVideo    = document.getElementById('sel-video');
const selAudio    = document.getElementById('sel-audio');
const btnInspect  = document.getElementById('btn-inspect');
const btnDownload = document.getElementById('btn-download');
const btnCancel   = document.getElementById('btn-cancel');

cookieToggle.addEventListener('click', () => {
  const open = cookieRow.style.display !== 'none';
  cookieRow.style.display = open ? 'none' : 'block';
  cookieToggle.textContent = open ? '+ Add cookies' : '− Hide cookies';
});

function showUrlStep() {
  urlStep.style.display = '';
  fmtStep.style.display = 'none';
  formMsg.textContent = '';
}

function showFmtStep() {
  urlStep.style.display = 'none';
  fmtStep.style.display = 'block';
  fmtMsg.textContent = '';
}

function estimateSize(bitrateKbps, duration) {
  if (!bitrateKbps || !duration) return null;
  return (bitrateKbps * 1000 / 8) * duration;
}

function fmtSizeLabel(exact, bitrateKbps, duration) {
  if (exact != null) return fmtSize(exact);
  const est = estimateSize(bitrateKbps, duration);
  return est ? `~${fmtSize(est)}` : '';
}

function videoOptionLabel(f, duration) {
  const parts = [];
  if (f.height) parts.push(`${f.height}p`);
  if (f.fps > 30) parts.push(`${f.fps}fps`);
  if (f.codec)  parts.push(f.codec);
  const size = fmtSizeLabel(f.size, f.vbr, duration);
  if (size) parts.push(size);
  return parts.join(' · ');
}

function audioOptionLabel(f, duration) {
  const parts = [];
  if (f.abr)   parts.push(`${Math.round(f.abr)} kbps`);
  if (f.codec) parts.push(f.codec);
  if (f.asr)   parts.push(`${(f.asr/1000).toFixed(0)} kHz`);
  const size = fmtSizeLabel(f.size, f.abr, duration);
  if (size) parts.push(size);
  return parts.join(' · ');
}

btnInspect.addEventListener('click', async () => {
  const url = urlInput.value.trim();
  if (!url) return;
  pendingUrl = url;
  pendingCookies = cookieInput.value.trim();
  btnInspect.disabled = true;
  formMsg.textContent = 'Fetching formats…';

  try {
    const r = await fetch('/api/formats', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({url, cookies: pendingCookies || undefined}),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);

    videoTitle.textContent = j.title || url;
    const duration = j.duration || null;

    selVideo.innerHTML = j.video.map(f =>
      `<option value="${escapeAttr(f.id)}">${escapeHtml(videoOptionLabel(f, duration))}</option>`
    ).join('');

    selAudio.innerHTML = j.audio.map(f =>
      `<option value="${escapeAttr(f.id)}">${escapeHtml(audioOptionLabel(f, duration))}</option>`
    ).join('');

    showFmtStep();
  } catch (err) {
    formMsg.textContent = `Error: ${err.message}`;
  } finally {
    btnInspect.disabled = false;
  }
});

btnCancel.addEventListener('click', () => {
  showUrlStep();
});

btnDownload.addEventListener('click', async () => {
  const videoId = selVideo.value;
  const audioId = selAudio.value;
  const format_id = videoId && audioId ? `${videoId}+${audioId}` : (videoId || audioId || null);

  btnDownload.disabled = true;
  fmtMsg.textContent = 'Queuing…';

  try {
    const r = await fetch('/api/download', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({url: pendingUrl, format_id, cookies: pendingCookies || undefined}),
    });
    if (!r.ok) {
      const j = await r.json().catch(() => ({}));
      throw new Error(j.error || `HTTP ${r.status}`);
    }
    urlInput.value = '';
    showUrlStep();
    refresh();
  } catch (err) {
    fmtMsg.textContent = `Error: ${err.message}`;
  } finally {
    btnDownload.disabled = false;
  }
});

// ── Downloads & Library polling ────────────────────────────────────────────

const downloadsEl = document.getElementById('downloads');
const libraryEl   = document.getElementById('library');

function renderProgressBars(j) {
  const sp = j.stream_progress || [j.progress || 0];
  const active = j.status === 'downloading' || j.status === 'queued';
  if (!active) return '';

  const allDone = sp.every(p => p >= 100);
  if (allDone) {
    // All streams downloaded; ffmpeg merge in progress.
    return `<div class="progress-wrap">
      <div class="progress-row">
        <span class="progress-label" style="width:auto;color:var(--muted);font-size:12px;">Merging…</span>
      </div>
    </div>`;
  }

  const labels = sp.length === 2 ? ['Video', 'Audio'] : [''];
  const sb = j.stream_bytes || sp.map(() => [0, 0]);
  return `<div class="progress-wrap">${sp.map((pct, i) => {
    const [dl, tot] = sb[i] || [0, 0];
    const sizeLabel = tot ? `${fmtSize(dl)} / ${fmtSize(tot)}` : `${pct.toFixed(0)}%`;
    return `
    <div class="progress-row">
      ${sp.length > 1 ? `<span class="progress-label">${labels[i]}</span>` : ''}
      <div class="progress"><div style="width:${Math.min(pct, 100)}%"></div></div>
      <span style="font-size:11px;color:var(--muted);white-space:nowrap;flex-shrink:0;">${sizeLabel}</span>
    </div>`;
  }).join('')}
  </div>`;
}

function renderDownloads(jobs) {
  const active = jobs.filter(j => j.status === 'queued' || j.status === 'downloading');
  const recent = jobs.filter(j => j.status === 'done' || j.status === 'error');
  const list = [...active, ...recent];
  if (!list.length) {
    downloadsEl.innerHTML = '<div class="empty">No downloads yet.</div>';
    return;
  }
  downloadsEl.innerHTML = list.map(j => {
    const title = j.title || j.url;
    const etaBits = [];
    if (j.status === 'downloading') {
      if (j.speed) etaBits.push(`${fmtSize(j.speed)}/s`);
      if (j.eta != null) etaBits.push(`ETA ${fmtEta(j.eta)}`);
    }
    return `
      <div class="card">
        <div class="row">
          <div class="grow">
            <div class="name">${escapeHtml(title)}</div>
            ${etaBits.length ? `<div class="meta">${etaBits.join(' · ')}</div>` : ''}
          </div>
          <span class="badge ${j.status}">${j.status}</span>
        </div>
        ${renderProgressBars(j)}
        ${j.error ? `<div class="err">${escapeHtml(j.error)}</div>` : ''}
      </div>
    `;
  }).join('');
}

function renderLibrary(videos) {
  if (!videos.length) {
    libraryEl.innerHTML = '<div class="empty">Empty. Submit a URL above to get started.</div>';
    return;
  }
  libraryEl.innerHTML = videos.map(v => `
    <div class="card">
      <div class="row">
        <div class="grow">
          <div class="name">${escapeHtml(v.name)}</div>
          <div class="meta">${fmtSize(v.size_bytes)}</div>
        </div>
        <a href="/files/${encodeURIComponent(v.name)}">Open</a>
        <button class="danger" data-name="${escapeAttr(v.name)}">Delete</button>
      </div>
    </div>
  `).join('');
  libraryEl.querySelectorAll('button.danger').forEach(btn => {
    btn.addEventListener('click', async () => {
      const name = btn.dataset.name;
      if (!confirm(`Delete "${name}"?`)) return;
      const r = await fetch(`/api/library/${encodeURIComponent(name)}`, {method: 'DELETE'});
      if (!r.ok) {
        const j = await r.json().catch(() => ({}));
        alert(`Delete failed: ${j.error || r.status}`);
        return;
      }
      refresh();
    });
  });
}

async function refresh() {
  try {
    const [d, l] = await Promise.all([
      fetch('/api/downloads').then(r => r.json()),
      fetch('/api/library').then(r => r.json()),
    ]);
    renderDownloads(d.jobs || []);
    renderLibrary(l.videos || []);
  } catch (e) {
    // ignore transient network errors; next tick will retry
  }
}

refresh();
setInterval(refresh, 1500);

// ── Admin ──────────────────────────────────────────────────────────────────

const btnUpdate  = document.getElementById('btn-update');
const btnRestart = document.getElementById('btn-restart');
const adminMsg   = document.getElementById('admin-msg');
const adminOutput= document.getElementById('admin-output');

function setAdminBusy(busy) {
  btnUpdate.disabled = busy;
  btnRestart.disabled = busy;
}

btnUpdate.addEventListener('click', async () => {
  if (!confirm('Update yt-dlp now? This may take up to a minute.')) return;
  setAdminBusy(true);
  adminMsg.textContent = 'Updating yt-dlp…';
  adminOutput.style.display = 'none';
  try {
    const r = await fetch('/api/admin/update-ytdlp', {method: 'POST'});
    const j = await r.json();
    adminMsg.textContent = j.ok
      ? 'Updated. Restart the service to use the new version.'
      : 'Update failed.';
    if (j.output) {
      adminOutput.textContent = j.output;
      adminOutput.style.display = 'block';
    }
  } catch (err) {
    adminMsg.textContent = `Error: ${err.message}`;
  } finally {
    setAdminBusy(false);
  }
});

btnRestart.addEventListener('click', async () => {
  if (!confirm('Restart the server? The page will reconnect automatically.')) return;
  setAdminBusy(true);
  adminMsg.textContent = 'Restarting…';
  adminOutput.style.display = 'none';
  try { await fetch('/api/admin/restart', {method: 'POST'}); } catch (_) {}
  adminMsg.textContent = 'Waiting for server to come back…';
  const poll = setInterval(async () => {
    try {
      await fetch('/api/downloads');
      clearInterval(poll);
      adminMsg.textContent = 'Server restarted.';
      setAdminBusy(false);
    } catch (_) {}
  }, 1500);
});
</script>
</body>
</html>
